[package]
# crates.io already has a `serf` (and a `self`); the binary below is still serf.
name = "selflang"
version = "0.11.0"
edition = "2021"
description = "A Self VM in Rust: scanner, parser, bytecode compiler, interpreter, and the C++ VM's snapshot format"
license = "Apache-2.0"
repository = "https://github.com/mkmik/serf"
# The checked-in worlds and screenshots are ~27 MB even gzipped, past crates.io's
# 10 MB package limit, and nothing in the crate needs them to build.
exclude = ["*.snap", "shots/", "reference/"]

[[bin]]
name = "serf"
path = "src/main.rs"

# The VM itself has no dependencies, so it ports wherever rustc goes:
# `--no-default-features` builds the interpreter and the X11 path, which reaches
# libX11 through src/ffi.rs and needs nothing at link time. Only the native
# canvas takes crates, and cosmic-text's tree is pure Rust -- no -sys crate, no
# cc, no pkg-config -- so it cross-compiles the same way.
[features]
default = ["native"]
native = ["dep:cosmic-text", "dep:softbuffer", "dep:winit"]

[dependencies]
cosmic-text = { version = "0.19", optional = true }
softbuffer = { version = "0.4", optional = true }
winit = { version = "0.30", optional = true }

[profile.release]
opt-level = 3
